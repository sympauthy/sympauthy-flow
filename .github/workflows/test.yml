name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, format, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Format
        run: npx prettier --check src

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build
